name: ADES dynamic crossover evidence
on:
  pull_request:
    paths:
      - 'benchmarks/phase_diagram.cpp'
      - 'tools/memory_crossover.py'
      - 'tools/analyze_crossover.py'
      - '.github/workflows/dynamic-crossover.yml'
      - 'docs/DYNAMIC_CROSSOVER_PR39.md'
  workflow_dispatch:
    inputs:
      queries:
        description: 'Queries per matched trace'
        required: true
        default: '100'
      repeats:
        description: 'Repetitions per matched cell'
        required: true
        default: '2'

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Verify New York graph
        run: bash tools/verify_ny_dimacs.sh benchmarks/data
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Exercise alternating increases and decreases
        run: |
          python3 tools/memory_crossover.py \
            --graph benchmarks/data/USA-road-d.NY.gr.gz \
            --output results/dynamic-crossover-smoke \
            --queries 12 --repeats 1 --caps 2 --seeds 7 \
            --families uniform --update-every 5 \
            --update-mode alternating --require-both-update-directions \
            --timeout 120
          python3 tools/analyze_crossover.py \
            results/dynamic-crossover-smoke/measurements.csv \
            --output-dir results/dynamic-crossover-smoke

  compare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Verify New York graph
        run: bash tools/verify_ny_dimacs.sh benchmarks/data

      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure

      - name: Run dynamic matched-cap matrix
        env:
          QUERIES: ${{ inputs.queries }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          [[ "$QUERIES" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPEATS" =~ ^[1-9][0-9]*$ ]]
          python3 tools/memory_crossover.py \
            --graph benchmarks/data/USA-road-d.NY.gr.gz \
            --output results/dynamic-crossover \
            --queries "$QUERIES" \
            --repeats "$REPEATS" \
            --caps 2 8 \
            --seeds 7 17 \
            --families uniform single-hot hot-pool \
            --update-every 5 10 \
            --update-mode alternating \
            --require-both-update-directions \
            --timeout 600

      - name: Produce descriptive paired analysis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s results/dynamic-crossover/measurements.csv ]]; then
            python3 tools/analyze_crossover.py \
              results/dynamic-crossover/measurements.csv \
              --output-dir results/dynamic-crossover
          fi

      - name: Upload dynamic evidence including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ades-dynamic-crossover-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/dynamic-crossover/
          if-no-files-found: warn
          retention-days: 30
