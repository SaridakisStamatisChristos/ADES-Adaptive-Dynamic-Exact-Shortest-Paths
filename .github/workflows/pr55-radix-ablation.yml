name: ADES PR55 radix queue ablation

on:
  pull_request:
    paths:
      - 'include/ades/radix_queue.hpp'
      - 'src/shortest_paths.cpp'
      - 'src/dynamic_repair.cpp'
      - 'tests/pr55_radix.cpp'
      - 'tools/run_pr55_radix_ablation.py'
      - '.github/workflows/pr55-radix-ablation.yml'
      - 'CMakeLists.txt'

jobs:
  multi-topology-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR55 candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout frozen PR54 baseline
        uses: actions/checkout@v4
        with:
          ref: pr54-core-engine-phase-change
          path: baseline
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build isolated runners and radix tests
        run: |
          cmake -S baseline -B baseline/build -DCMAKE_BUILD_TYPE=Release
          cmake --build baseline/build -j2 --target ades_pilot_profile
          cmake -S candidate -B candidate/build -DCMAKE_BUILD_TYPE=Release
          cmake --build candidate/build -j2 --target ades_pilot_profile ades_workload_v2 ades_pr55_radix_tests ades_pr54_core_tests
          candidate/build/ades_pr55_radix_tests
          candidate/build/ades_pr54_core_tests
      - name: Generate common deterministic graphs
        run: |
          mkdir -p shared/graphs
          python3 candidate/tools/generate_synthetic_graphs.py shared/graphs --only syn-grid-224x224-v1
          python3 candidate/tools/generate_synthetic_graphs.py shared/graphs --only syn-scale-free-50000-m4-v1
          python3 candidate/tools/generate_synthetic_graphs.py shared/graphs --only syn-clustered-50000-c100-d6-v1
      - name: Run PR54 vs PR55 multi-topology ablation
        run: |
          python3 candidate/tools/run_pr55_radix_ablation.py \
            --baseline-runner baseline/build/ades_pilot_profile \
            --candidate-runner candidate/build/ades_pilot_profile \
            --generator candidate/build/ades_workload_v2 \
            --graph-dir shared/graphs \
            --out candidate/results/pr55-radix-ablation
      - name: Upload ablation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr55-radix-ablation-${{ github.sha }}
          path: candidate/results/pr55-radix-ablation/
          retention-days: 90
