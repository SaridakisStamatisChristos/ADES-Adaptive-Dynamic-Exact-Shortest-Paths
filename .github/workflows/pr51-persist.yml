name: PR51 permanent evidence persistence

on:
  push:
    branches:
      - pr51-fast-cold-early-promotion

permissions:
  actions: read
  contents: write

jobs:
  persist:
    if: contains(github.event.head_commit.message, '[pr51-persist]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr51-fast-cold-early-promotion
          fetch-depth: 0
      - name: Download frozen PR51 full-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/pr51-artifact
          mkdir -p /tmp/pr51-artifact
          gh run download 37897020318 \
            --repo "${{ github.repository }}" \
            --name ades-pr51-fast-economic-full \
            --dir /tmp/pr51-artifact
          test -s /tmp/pr51-artifact/decision.json
          test -s /tmp/pr51-artifact/ANALYSIS.md
          test -s /tmp/pr51-artifact/measurements.csv
          test -s /tmp/pr51-artifact/manifest.json
      - name: Verify and package permanent evidence
        run: |
          dest=evidence/pr51-fast/8363cd090686c00eb7ffad137f2579c3e44961fe
          mkdir -p "$dest"
          cp /tmp/pr51-artifact/ANALYSIS.md "$dest/ANALYSIS.md"
          cp /tmp/pr51-artifact/decision.json "$dest/decision.json"
          cp /tmp/pr51-artifact/measurements.csv "$dest/measurements.csv"
          cp /tmp/pr51-artifact/summary.csv "$dest/summary.csv"
          cp /tmp/pr51-artifact/confidence.csv "$dest/confidence.csv"
          cp /tmp/pr51-artifact/manifest.json "$dest/manifest.json"
          tar -C /tmp/pr51-artifact -czf "$dest/compact-evidence.tgz" \
            measurements.csv summary.csv confidence.csv ANALYSIS.md decision.json manifest.json \
            regression/traces regression/oracles holdout2/traces holdout2/oracles
          (cd "$dest" && sha256sum ANALYSIS.md decision.json measurements.csv summary.csv confidence.csv manifest.json compact-evidence.tgz > SHA256SUMS)
          test "$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pr51-artifact/decision.json'))
          print(d['holdout2_material_regressions'])
          PY
          )" = "6"
      - name: Commit immutable evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/pr51-fast/8363cd090686c00eb7ffad137f2579c3e44961fe
          if git diff --cached --quiet; then
            echo "Evidence already persisted"
            exit 0
          fi
          git commit -m "pr51: persist frozen holdout2 evidence"
          git push origin HEAD:pr51-fast-cold-early-promotion
