name: ADES PR69 GraphBolt optimizer differential

on:
  push:
    branches: [pr69-graphbolt-weighted-sssp-qualification]
    paths:
      - '.github/workflows/pr69-graphbolt-gdb-diagnostic.yml'
      - 'tools/run_pr69_graphbolt_qualification.py'

permissions:
  contents: read

env:
  GRAPHBOLT_SHA: 7c2792cc77d59b9722288ded8c3c62f6a9a87fc7
  MIMALLOC_SHA: 04f1c3b1e23677ce03bd16137e73089abd552175

jobs:
  optimizer-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4

      - name: Fetch pinned GraphBolt and mimalloc
        run: |
          set -euo pipefail
          git clone https://github.com/pdclab/graphbolt.git external/graphbolt
          git -C external/graphbolt checkout --detach "$GRAPHBOLT_SHA"
          test "$(git -C external/graphbolt rev-parse HEAD)" = "$GRAPHBOLT_SHA"
          test -z "$(git -C external/graphbolt status --porcelain)"
          git clone https://github.com/microsoft/mimalloc.git external/mimalloc
          git -C external/mimalloc checkout --detach "$MIMALLOC_SHA"
          test "$(git -C external/mimalloc rev-parse HEAD)" = "$MIMALLOC_SHA"
          cmake -S external/mimalloc -B external/mimalloc/out/release \
            -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_TESTS=OFF
          cmake --build external/mimalloc/out/release --parallel 2
          test -f external/mimalloc/out/release/libmimalloc.so

      - name: Build pristine source at O0
        run: |
          set -euo pipefail
          mkdir -p graphbolt-runtime evidence/pr69-o0
          g++ -std=c++14 -O0 -g -DOPENMP -fopenmp -DEDGELONG -DEDGEDATA \
            -include cstdint external/graphbolt/apps/SSSP.C -pthread \
            -o graphbolt-runtime/graphbolt_sssp_o0
          test -x graphbolt-runtime/graphbolt_sssp_o0
          test -z "$(git -C external/graphbolt status --porcelain)"
          sha256sum graphbolt-runtime/graphbolt_sssp_o0 > evidence/pr69-o0/binary-sha256.txt
          g++ --version | head -1 > evidence/pr69-o0/compiler.txt

      - name: Run exact frozen qualification matrix at O0
        env:
          OMP_NUM_THREADS: '1'
          LD_PRELOAD: ${{ github.workspace }}/external/mimalloc/out/release/libmimalloc.so
        run: |
          set +e
          python3 tools/run_pr69_graphbolt_qualification.py \
            --graphbolt "$PWD/graphbolt-runtime/graphbolt_sssp_o0" \
            --out evidence/pr69-o0/matrix
          rc=$?
          echo "$rc" > evidence/pr69-o0/exit-code.txt
          cat evidence/pr69-o0/matrix/qualification.json || true
          exit 0

      - name: Record diagnostic provenance
        if: always()
        run: |
          set -euo pipefail
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "graphbolt_sha=${GRAPHBOLT_SHA}"
            echo "mimalloc_sha=${MIMALLOC_SHA}"
            echo "single_changed_factor=optimization_level_O3_to_O0"
            echo "build=-std=c++14 -O0 -g -DOPENMP -fopenmp -DEDGELONG -DEDGEDATA -include cstdint"
            echo "omp_threads=1"
            echo "diagnostic_only=true"
            echo "upstream_source_modified=false"
            echo "semantic_gate_modified=false"
            g++ --version | head -1
            uname -a
          } > evidence/pr69-o0/provenance.txt

      - name: Upload O0 differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr69-graphbolt-o0-${{ github.sha }}
          path: evidence/pr69-o0
          if-no-files-found: error
          retention-days: 90
