name: Definitive NY evidence
on:
  push:
    branches:
      - evidence/ny-definitive-parallel-2026-10-07
  workflow_dispatch:
    inputs:
      ops:
        description: Operations per B0-B4 trace
        required: true
        default: "200"
      reps:
        description: Repetitions per matrix cell
        required: true
        default: "5"
      controller_rounds:
        description: Targeted controller rounds
        required: true
        default: "20"
permissions:
  contents: read
env:
  EVIDENCE_OPS: ${{ inputs.ops || '200' }}
  EVIDENCE_REPS: ${{ inputs.reps || '5' }}
  CONTROLLER_ROUNDS: ${{ inputs.controller_rounds || '20' }}
jobs:
  matrix:
    name: matrix-${{ matrix.metric }}-${{ matrix.workload }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        metric: [distance, time]
        workload: [mixed, local, cross, clustered, moving]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Verify corpus
        run: bash tools/verify_ny_dimacs.sh benchmarks/data
      - name: Build Release
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Run isolated B0-B4 cell
        run: |
          rm -rf results && mkdir results
          if [[ "${{ matrix.metric }}" == distance ]]; then
            graph="benchmarks/data/USA-road-d.NY.gr.gz"
            prefix="USA-road-d.NY"
          else
            graph="benchmarks/data/USA-road-t.NY.gr.gz"
            prefix="USA-road-t.NY"
          fi
          workload="${{ matrix.workload }}"
          if [[ "$workload" == mixed ]]; then
            bash benchmarks/run_matrix.sh "$graph" "$EVIDENCE_OPS" 7 "$EVIDENCE_REPS" "$workload"
          else
            bash benchmarks/run_matrix.sh "$graph" "$EVIDENCE_OPS" 7 "$EVIDENCE_REPS" "$workload" benchmarks/data/USA-road-d.NY.co.gz
          fi
          latest="$(find results -maxdepth 1 -type f -name 'bench-*.csv' | sort | tail -n1)"
          meta="${latest%.csv}.meta"
          mv "$latest" "results/${prefix}-${workload}.csv"
          [[ -f "$meta" ]] && mv "$meta" "results/${prefix}-${workload}.meta"
      - uses: actions/upload-artifact@v4
        with:
          name: ny-cell-${{ matrix.metric }}-${{ matrix.workload }}
          path: results/
          if-no-files-found: error
          retention-days: 90

  controller:
    name: controller-${{ matrix.metric }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        metric: [distance, time]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Verify corpus
        run: bash tools/verify_ny_dimacs.sh benchmarks/data
      - name: Build Release
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Run controller ablations
        run: |
          rm -rf results && mkdir results
          if [[ "${{ matrix.metric }}" == distance ]]; then
            graph="benchmarks/data/USA-road-d.NY.gr.gz"
            prefix="USA-road-d.NY"
          else
            graph="benchmarks/data/USA-road-t.NY.gr.gz"
            prefix="USA-road-t.NY"
          fi
          bash benchmarks/run_controller_ablation.sh "$graph" "$CONTROLLER_ROUNDS" 7 "$EVIDENCE_REPS"
          latest="$(find results -maxdepth 1 -type f -name 'controller-*.csv' | sort | tail -n1)"
          mv "$latest" "results/${prefix}-controller.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: ny-controller-${{ matrix.metric }}
          path: results/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate-evidence
    needs: [matrix, controller]
    if: ${{ always() && needs.matrix.result == 'success' && needs.controller.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ny-*
          path: downloaded
      - name: Assemble evidence
        run: |
          rm -rf results && mkdir results
          find downloaded -type f \( -name '*.csv' -o -name '*.meta' \) -exec cp {} results/ \;
          test "$(find results -maxdepth 1 -name '*.csv' | wc -l)" -eq 12
          python3 benchmarks/summarize_results.py
      - name: Show summary
        run: cat results/SUMMARY.md
      - uses: actions/upload-artifact@v4
        with:
          name: ades-ny-evidence-${{ github.sha }}
          path: results/
          if-no-files-found: error
          retention-days: 90
