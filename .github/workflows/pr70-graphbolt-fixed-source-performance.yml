name: ADES PR70 GraphBolt fixed-source performance holdout

on:
  push:
    branches: [pr70-graphbolt-fixed-source-performance]
  pull_request:
    paths:
      - 'docs/PR70_GRAPHBOLT_FIXED_SOURCE_PERFORMANCE_CONTRACT.md'
      - 'tools/pr70_ades_fixed_source.cpp'
      - 'tools/run_pr70_graphbolt_performance.py'
      - 'CMakeLists.txt'
      - '.github/workflows/pr70-graphbolt-fixed-source-performance.yml'

permissions:
  contents: read

env:
  GRAPHBOLT_SHA: 7c2792cc77d59b9722288ded8c3c62f6a9a87fc7
  MIMALLOC_SHA: 04f1c3b1e23677ce03bd16137e73089abd552175
  PATCH_ID: kickstarter-missing-return-v1

jobs:
  holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR70 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Freeze harness and contract identities
        run: |
          set -euo pipefail
          mkdir -p evidence/pr70/provenance
          python3 -m py_compile tools/run_pr70_graphbolt_performance.py
          sha256sum \
            docs/PR70_GRAPHBOLT_FIXED_SOURCE_PERFORMANCE_CONTRACT.md \
            tools/pr70_ades_fixed_source.cpp \
            tools/run_pr70_graphbolt_performance.py \
            > evidence/pr70/provenance/pr70-input-sha256.txt

      - name: Build and test frozen ADES lineage
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          test -x build/ades_pr70_fixed_source
          sha256sum build/ades_pr70_fixed_source > evidence/pr70/provenance/ades-runner-sha256.txt

      - name: Fetch exact upstream GraphBolt DZiG revision
        run: |
          set -euo pipefail
          git clone https://github.com/pdclab/graphbolt.git external/graphbolt
          git -C external/graphbolt checkout --detach "$GRAPHBOLT_SHA"
          test "$(git -C external/graphbolt rev-parse HEAD)" = "$GRAPHBOLT_SHA"
          test -z "$(git -C external/graphbolt status --porcelain)"
          sha256sum \
            external/graphbolt/apps/SSSP.C \
            external/graphbolt/apps/SSSP_edgeData.h \
            external/graphbolt/core/graphBolt/KickStarterEngine.h \
            external/graphbolt/core/graphBolt/ingestor.h \
            external/graphbolt/core/common/parallel.h \
            > evidence/pr70/provenance/graphbolt-upstream-sha256.txt

      - name: Build pinned upstream-required mimalloc v1.6.0
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/mimalloc.git external/mimalloc
          git -C external/mimalloc checkout --detach "$MIMALLOC_SHA"
          test "$(git -C external/mimalloc rev-parse HEAD)" = "$MIMALLOC_SHA"
          test -z "$(git -C external/mimalloc status --porcelain)"
          cmake -S external/mimalloc -B external/mimalloc/out/release \
            -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_TESTS=OFF
          cmake --build external/mimalloc/out/release --parallel 2
          test -f external/mimalloc/out/release/libmimalloc.so
          sha256sum external/mimalloc/out/release/libmimalloc.so \
            > evidence/pr70/provenance/mimalloc-library-sha256.txt

      - name: Apply only PR69-qualified portability repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('external/graphbolt/core/graphBolt/KickStarterEngine.h')
          s = p.read_text()
          signature = '  int traditionalIncrementalComputation() {\n    while (active_vertices_bitset.anyScheduledTasks()) {'
          marker = '      }\n    }\n  }\n\n  void deltaCompute(edgeArray &edge_additions, edgeArray &edge_deletions) {'
          replacement = '      }\n    }\n    return 0;  // ADES PR69 portability repair: caller ignores return value.\n  }\n\n  void deltaCompute(edgeArray &edge_additions, edgeArray &edge_deletions) {'
          if s.count(signature) != 1:
              raise SystemExit('unique no-arg traditionalIncrementalComputation signature not found')
          start = s.index(signature)
          head, tail = s[:start], s[start:]
          if tail.count(marker) != 1:
              raise SystemExit('unique function terminator not found')
          p.write_text(head + tail.replace(marker, replacement, 1))
          PY
          git -C external/graphbolt diff --check
          git -C external/graphbolt diff -- core/graphBolt/KickStarterEngine.h \
            | tee evidence/pr70/provenance/portability.patch
          test "$(git -C external/graphbolt diff --numstat | awk '{print $1":"$2":"$3}')" \
            = "1:0:core/graphBolt/KickStarterEngine.h"
          grep -Fq 'return 0;  // ADES PR69 portability repair: caller ignores return value.' \
            external/graphbolt/core/graphBolt/KickStarterEngine.h
          sha256sum \
            external/graphbolt/core/graphBolt/KickStarterEngine.h \
            evidence/pr70/provenance/portability.patch \
            > evidence/pr70/provenance/graphbolt-patched-sha256.txt

      - name: Build PR69-qualified GraphBolt performance binary
        run: |
          set -euo pipefail
          mkdir -p graphbolt-runtime
          g++ -std=c++14 -O3 -g -DOPENMP -fopenmp -DEDGELONG -DEDGEDATA \
            -include cstdint external/graphbolt/apps/SSSP.C -pthread \
            -o graphbolt-runtime/graphbolt_sssp_patched
          test -x graphbolt-runtime/graphbolt_sssp_patched
          sha256sum graphbolt-runtime/graphbolt_sssp_patched \
            > evidence/pr70/provenance/graphbolt-binary-sha256.txt
          ldd graphbolt-runtime/graphbolt_sssp_patched \
            > evidence/pr70/provenance/graphbolt-ldd.txt
          g++ --version | head -1 \
            > evidence/pr70/provenance/graphbolt-compiler.txt

      - name: Execute frozen correctness gate and performance holdout
        id: experiment
        run: |
          set +e
          python3 tools/run_pr70_graphbolt_performance.py \
            --graphbolt "$PWD/graphbolt-runtime/graphbolt_sssp_patched" \
            --ades "$PWD/build/ades_pr70_fixed_source" \
            --mimalloc "$PWD/external/mimalloc/out/release/libmimalloc.so" \
            --out evidence/pr70
          rc=$?
          echo "$rc" > evidence/pr70/experiment-exit-code.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record R7 provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/pr70/provenance
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "pr70_branch=pr70-graphbolt-fixed-source-performance"
            echo "pr70_contract_status=preregistered-before-comparative-timings"
            echo "graphbolt_sha=${GRAPHBOLT_SHA}"
            echo "mimalloc_sha=${MIMALLOC_SHA}"
            echo "portability_patch_id=${PATCH_ID}"
            echo "graphbolt_threads=4"
            echo "graphbolt_build=-std=c++14 -O3 -g -DOPENMP -fopenmp -DEDGELONG -DEDGEDATA -include cstdint"
            echo "ades_build=Release"
            echo "experiment_exit_code=${{ steps.experiment.outputs.exit_code }}"
            echo "claim_boundary=resident fixed-source dynamic SSSP maintenance core on frozen synthetic directed PR70 slice only"
            echo "pr69_semantic_evidence_run=38810408744"
            echo "pr69_semantic_evidence_job=116681917147"
            echo "pr69_semantic_evidence_artifact=12007379531"
            echo "pr69_semantic_evidence_digest=sha256:13755affc54b5abaff1f3c00dad9d92ae18a49ad6de8ca5af69bb5d035e6f238"
            python3 --version
            g++ --version | head -1
            cmake --version | head -1
            uname -a
          } > evidence/pr70/provenance/environment.txt

      - name: Enforce experiment completion rather than preferred outcome
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidence/pr70')
          summary_path = root / 'summary.json'
          if not summary_path.exists():
              raise SystemExit('PR70 did not produce summary.json')
          d = json.loads(summary_path.read_text())
          allowed = {
              'SUPPORTS_ADES_RESIDENT_FIXED_SOURCE_CORE_SUPERIORITY_ON_PR70_TESTED_SLICE',
              'FALSIFIES_PREFERRED_PR70_SUPERIORITY_HYPOTHESIS_ON_TESTED_SLICE',
              'REJECTED_CORRECTNESS_OR_DISTANCE_BOUND',
          }
          if d.get('disposition') not in allowed:
              raise SystemExit(f"unexpected PR70 disposition: {d.get('disposition')!r}")
          if d['disposition'] == 'REJECTED_CORRECTNESS_OR_DISTANCE_BOUND':
              raise SystemExit('semantic/distance gate failed; performance evidence not admitted')
          assert d.get('schema') == 'ades-pr70-graphbolt-fixed-source-performance-v1'
          assert d.get('independent_seeds') == 4
          assert d.get('measured_pairs') == 8
          assert d.get('correctness_all_exact') is True
          assert d.get('graphbolt_threads') == 4
          print('PR70 experiment completed without outcome-based gating')
          print(json.dumps({
              'disposition': d['disposition'],
              'maintenance': d['maintenance'],
              'total': d['total'],
              'seed_level': d['seed_level'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload PR70 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr70-graphbolt-fixed-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/pr70
          if-no-files-found: warn
          retention-days: 90
