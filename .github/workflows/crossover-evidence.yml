name: ADES crossover evidence
on:
  push:
    branches: [research/run-crossover-evidence]
    paths: ['.github/workflows/crossover-evidence.yml']
  workflow_dispatch:
jobs:
  phase:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Verify NY corpus
        run: |
          if ! bash tools/verify_ny_dimacs.sh benchmarks/data; then
            bash tools/fetch_ny_dimacs.sh benchmarks/data
            bash tools/verify_ny_dimacs.sh benchmarks/data
          fi
      - name: Build fixed commit
        run: |
          mkdir -p evidence/crossover
          git rev-parse HEAD | tee evidence/crossover/evidence-commit.txt
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Run frozen crossover surface
        run: bash benchmarks/run_phase_diagram.sh benchmarks/data/USA-road-d.NY.gr.gz evidence/crossover/ny-distance-phase.csv 2000
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossover-evidence-${{ github.sha }}
          path: evidence/crossover/
          if-no-files-found: error
          retention-days: 90
