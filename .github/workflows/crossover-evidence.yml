name: ADES crossover evidence
on:
  push:
    branches: [research/run-crossover-evidence]
    paths: ['.github/workflows/crossover-evidence.yml']
  workflow_dispatch:
jobs:
  phase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        family: [uniform, zipf, single-hot, rotating-hot, hot-pool, churn]
        update_every: [0, 1000, 200, 50, 10]
    env:
      FAMILY: ${{ matrix.family }}
      UPDATE_EVERY: ${{ matrix.update_every }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Verify NY corpus
        run: |
          if ! bash tools/verify_ny_dimacs.sh benchmarks/data; then
            bash tools/fetch_ny_dimacs.sh benchmarks/data
            bash tools/verify_ny_dimacs.sh benchmarks/data
          fi
      - name: Build fixed algorithm
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Run frozen shard
        run: |
          set -euo pipefail
          case "$FAMILY" in uniform|zipf|single-hot|rotating-hot|hot-pool|churn) ;; *) exit 2;; esac
          case "$UPDATE_EVERY" in 0|1000|200|50|10) ;; *) exit 2;; esac
          mkdir -p evidence/crossover
          out="evidence/crossover/${FAMILY}-u${UPDATE_EVERY}.csv"
          echo "baseline,family,seed,queries,updates,update_every,hot_sources,epoch,cap,ns,cold_queries,resident_queries,promotions,evictions,rebuilds,repair_aborts" > "$out"
          for seed in 7 17 29 43 71; do
            for hs in 1 2 4 8 16 32; do
              for b in B1 B2 B3 B4; do
                ./build/ades_phase benchmarks/data/USA-road-d.NY.gr.gz "$b" "$FAMILY" 2000 "$UPDATE_EVERY" "$hs" 250 "$seed" 8 >> "$out"
              done
            done
          done
          git rev-parse HEAD > evidence/crossover/evidence-commit.txt
      - name: Preserve shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossover-${{ matrix.family }}-u${{ matrix.update_every }}-${{ github.sha }}
          path: evidence/crossover/
          if-no-files-found: warn
          retention-days: 90
