name: ADES PR72 GraphBolt email-Eu-core performance holdout

on:
  push:
    branches: [pr72-graphbolt-email-eu-core-performance]
  pull_request:
    paths:
      - 'docs/PR72_GRAPHBOLT_EMAIL_EU_CORE_PERFORMANCE_CONTRACT.md'
      - 'tools/run_pr72_email_eu_core_performance.py'
      - 'tools/run_pr70_graphbolt_performance.py'
      - 'tools/pr70_ades_fixed_source.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/pr72-graphbolt-email-eu-core-performance.yml'

permissions:
  contents: read

env:
  GRAPHBOLT_SHA: 7c2792cc77d59b9722288ded8c3c62f6a9a87fc7
  MIMALLOC_SHA: 04f1c3b1e23677ce03bd16137e73089abd552175
  PATCH_ID: kickstarter-missing-return-v1
  PR71_GZIP_SHA256: 4b47acdb80197b085fe63c819c357ae488131ee904ed93d1b219a68b0f9e245f
  PR71_CANONICAL_SHA256: f0cfcb0a49f8d12fa6a92061a93d07becd8808185494e9d73d4f6695809e9d5e

jobs:
  external-topology-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR72 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Freeze PR72 contract and harness identities
        run: |
          set -euo pipefail
          mkdir -p evidence/pr72/provenance evidence/pr72/source
          python3 -m py_compile \
            tools/run_pr70_graphbolt_performance.py \
            tools/run_pr72_email_eu_core_performance.py
          sha256sum \
            docs/PR72_GRAPHBOLT_EMAIL_EU_CORE_PERFORMANCE_CONTRACT.md \
            tools/run_pr72_email_eu_core_performance.py \
            tools/run_pr70_graphbolt_performance.py \
            tools/pr70_ades_fixed_source.cpp \
            > evidence/pr72/provenance/pr72-input-sha256.txt

      - name: Fetch and verify frozen PR71 topology bytes
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            --output evidence/pr72/source/email-Eu-core.txt.gz \
            https://snap.stanford.edu/data/email-Eu-core.txt.gz
          actual=$(sha256sum evidence/pr72/source/email-Eu-core.txt.gz | awk '{print $1}')
          test "$actual" = "$PR71_GZIP_SHA256"
          echo "$actual  email-Eu-core.txt.gz" \
            > evidence/pr72/provenance/topology-gzip-sha256.txt

      - name: Build and test unchanged ADES PR70 fixed-source runner
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          test -x build/ades_pr70_fixed_source
          sha256sum build/ades_pr70_fixed_source \
            > evidence/pr72/provenance/ades-runner-sha256.txt

      - name: Fetch exact upstream GraphBolt DZiG revision
        run: |
          set -euo pipefail
          git clone https://github.com/pdclab/graphbolt.git external/graphbolt
          git -C external/graphbolt checkout --detach "$GRAPHBOLT_SHA"
          test "$(git -C external/graphbolt rev-parse HEAD)" = "$GRAPHBOLT_SHA"
          test -z "$(git -C external/graphbolt status --porcelain)"
          sha256sum \
            external/graphbolt/apps/SSSP.C \
            external/graphbolt/apps/SSSP_edgeData.h \
            external/graphbolt/core/graphBolt/KickStarterEngine.h \
            external/graphbolt/core/graphBolt/ingestor.h \
            external/graphbolt/core/common/parallel.h \
            > evidence/pr72/provenance/graphbolt-upstream-sha256.txt

      - name: Build pinned upstream-required mimalloc v1.6.0
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/mimalloc.git external/mimalloc
          git -C external/mimalloc checkout --detach "$MIMALLOC_SHA"
          test "$(git -C external/mimalloc rev-parse HEAD)" = "$MIMALLOC_SHA"
          test -z "$(git -C external/mimalloc status --porcelain)"
          cmake -S external/mimalloc -B external/mimalloc/out/release \
            -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_TESTS=OFF
          cmake --build external/mimalloc/out/release --parallel 2
          test -f external/mimalloc/out/release/libmimalloc.so
          sha256sum external/mimalloc/out/release/libmimalloc.so \
            > evidence/pr72/provenance/mimalloc-library-sha256.txt

      - name: Apply only PR69-qualified GraphBolt portability repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('external/graphbolt/core/graphBolt/KickStarterEngine.h')
          s = p.read_text()
          signature = '  int traditionalIncrementalComputation() {\n    while (active_vertices_bitset.anyScheduledTasks()) {'
          marker = '      }\n    }\n  }\n\n  void deltaCompute(edgeArray &edge_additions, edgeArray &edge_deletions) {'
          replacement = '      }\n    }\n    return 0;  // ADES PR69 portability repair: caller ignores return value.\n  }\n\n  void deltaCompute(edgeArray &edge_additions, edgeArray &edge_deletions) {'
          if s.count(signature) != 1:
              raise SystemExit('unique no-arg traditionalIncrementalComputation signature not found')
          start = s.index(signature)
          head, tail = s[:start], s[start:]
          if tail.count(marker) != 1:
              raise SystemExit('unique function terminator not found')
          p.write_text(head + tail.replace(marker, replacement, 1))
          PY
          git -C external/graphbolt diff --check
          git -C external/graphbolt diff -- core/graphBolt/KickStarterEngine.h \
            | tee evidence/pr72/provenance/portability.patch
          test "$(git -C external/graphbolt diff --numstat | awk '{print $1":"$2":"$3}')" \
            = "1:0:core/graphBolt/KickStarterEngine.h"
          grep -Fq 'return 0;  // ADES PR69 portability repair: caller ignores return value.' \
            external/graphbolt/core/graphBolt/KickStarterEngine.h

      - name: Build PR69-qualified GraphBolt performance binary
        run: |
          set -euo pipefail
          mkdir -p graphbolt-runtime
          g++ -std=c++14 -O3 -g -DOPENMP -fopenmp -DEDGELONG -DEDGEDATA \
            -include cstdint external/graphbolt/apps/SSSP.C -pthread \
            -o graphbolt-runtime/graphbolt_sssp_patched
          test -x graphbolt-runtime/graphbolt_sssp_patched
          sha256sum graphbolt-runtime/graphbolt_sssp_patched \
            > evidence/pr72/provenance/graphbolt-binary-sha256.txt
          ldd graphbolt-runtime/graphbolt_sssp_patched \
            > evidence/pr72/provenance/graphbolt-ldd.txt
          g++ --version | head -1 \
            > evidence/pr72/provenance/graphbolt-compiler.txt

      - name: Execute frozen correctness gate and external-topology holdout
        id: experiment
        run: |
          set +e
          python3 tools/run_pr72_email_eu_core_performance.py \
            --graphbolt "$PWD/graphbolt-runtime/graphbolt_sssp_patched" \
            --ades "$PWD/build/ades_pr70_fixed_source" \
            --mimalloc "$PWD/external/mimalloc/out/release/libmimalloc.so" \
            --topology-gz "$PWD/evidence/pr72/source/email-Eu-core.txt.gz" \
            --out evidence/pr72
          rc=$?
          echo "$rc" > evidence/pr72/experiment-exit-code.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record R7 provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/pr72/provenance
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "pr72_branch=pr72-graphbolt-email-eu-core-performance"
            echo "contract_status=preregistered-before-comparative-timings"
            echo "topology=SNAP email-Eu-core; real directed topology; synthetic deterministic positive weights"
            echo "topology_gzip_sha256=${PR71_GZIP_SHA256}"
            echo "topology_canonical_sha256=${PR71_CANONICAL_SHA256}"
            echo "pr71_canonical_head=0220153da9ab087d4ed6dc5d999554a3d5c662bf"
            echo "pr71_canonical_run=38841945651"
            echo "pr71_canonical_artifact=12021033601"
            echo "pr71_canonical_artifact_digest=sha256:05702c8f939e3444e2ddcca267074454f306885ce1ec76dad54f172ac98531a8"
            echo "graphbolt_sha=${GRAPHBOLT_SHA}"
            echo "mimalloc_sha=${MIMALLOC_SHA}"
            echo "portability_patch_id=${PATCH_ID}"
            echo "graphbolt_threads=4"
            echo "self_loops=642 preserved in initial graph; never selected for dynamic replacement"
            echo "scenario_sources=102,308,525,828"
            echo "scenario_weight_seeds=7201,7207,7211,7213"
            echo "scenario_interpretation=within-one-topology robustness conditions, not independent topology replications"
            echo "experiment_exit_code=${{ steps.experiment.outputs.exit_code }}"
            python3 --version
            g++ --version | head -1
            cmake --version | head -1
            uname -a
          } > evidence/pr72/provenance/environment.txt

      - name: Enforce completion rather than preferred outcome
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('evidence/pr72/summary.json')
          if not p.exists():
              raise SystemExit('PR72 did not produce summary.json')
          d = json.loads(p.read_text())
          allowed = {
              'SUPPORTS_ADES_FIXED_SOURCE_SUPERIORITY_ON_PR72_EMAIL_EU_CORE_SLICE',
              'FALSIFIES_PREFERRED_PR72_EXTERNAL_TOPOLOGY_HYPOTHESIS_ON_TESTED_SLICE',
              'REJECTED_CORRECTNESS_TOPOLOGY_OR_DISTANCE_BOUND',
          }
          if d.get('disposition') not in allowed:
              raise SystemExit(f"unexpected PR72 disposition: {d.get('disposition')!r}")
          if d['disposition'] == 'REJECTED_CORRECTNESS_TOPOLOGY_OR_DISTANCE_BOUND':
              raise SystemExit('semantic/topology/distance gate failed; performance evidence not admitted')
          assert d.get('schema') == 'ades-pr72-graphbolt-email-eu-core-performance-v1'
          assert d.get('correctness_all_exact') is True
          assert d.get('scenario_count') == 4
          assert d.get('measured_pairs') == 8
          assert d.get('graphbolt_threads') == 4
          assert d['topology']['raw_gzip_sha256'] == '4b47acdb80197b085fe63c819c357ae488131ee904ed93d1b219a68b0f9e245f'
          assert d['topology']['canonical_sha256'] == 'f0cfcb0a49f8d12fa6a92061a93d07becd8808185494e9d73d4f6695809e9d5e'
          assert d['topology']['self_loops'] == 642
          assert d['topology']['largest_scc']['sources'] == [102, 308, 525, 828]
          assert [x['source'] for x in d['scenario_level']] == [102, 308, 525, 828]
          print('PR72 experiment completed without outcome-based gating')
          print(json.dumps({
              'disposition': d['disposition'],
              'maintenance': d['maintenance'],
              'total': d['total'],
              'scenario_level': d['scenario_level'],
              'bootstrap_interpretation': d['bootstrap_interpretation'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload PR72 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr72-graphbolt-email-eu-core-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/pr72
          if-no-files-found: warn
          retention-days: 90
