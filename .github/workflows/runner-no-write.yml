name: Runner no-write diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/runner-no-write.yml"

permissions:
  contents: read

jobs:
  no-write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pure no-write wait
        shell: bash
        run: sleep 600
