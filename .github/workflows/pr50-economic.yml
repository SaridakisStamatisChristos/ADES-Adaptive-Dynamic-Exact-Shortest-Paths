name: ADES PR50 predictive economic gate

on:
  pull_request:
  push:
    branches:
      - pr50-predictive-economic-residency
  workflow_dispatch:
    inputs:
      queries:
        description: Queries per trace for full PR50 benchmark
        required: false
        default: "60"
      phase:
        description: development, holdout, or both
        required: false
        default: "both"

permissions:
  contents: write

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Validate Python
        run: python3 -m py_compile tools/run_pr50_economic.py
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Run PR50 structural smoke
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 tools/run_pr50_economic.py \
            --repo . --build build --output results/pr50-smoke \
            --queries 12 --smoke
          test -s results/pr50-smoke/measurements.csv
          test -s results/pr50-smoke/summary.csv
          test -s results/pr50-smoke/confidence.csv
          test -s results/pr50-smoke/ANALYSIS.md
          test -s results/pr50-smoke/decision.json
          test -s results/pr50-smoke/manifest.json
          test -s results/pr50-smoke/SHA256SUMS
      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr50-economic-smoke
          path: results/pr50-smoke
          if-no-files-found: error
          retention-days: 30

  full:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[pr50-full]'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Verify committed NY graph
        run: bash tools/verify_ny_dimacs.sh benchmarks/data
      - name: Validate Python
        run: python3 -m py_compile tools/run_pr50_economic.py tools/generate_synthetic_graphs.py
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Run PR50 development and holdout benchmark
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          phase="${{ inputs.phase }}"
          queries="${{ inputs.queries }}"
          if [ -z "$phase" ]; then phase=both; fi
          if [ -z "$queries" ]; then queries=60; fi
          python3 tools/run_pr50_economic.py \
            --repo . --build build --output results/pr50-economic \
            --queries "$queries" --phase "$phase"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/pr50-economic')
          decision = json.loads((p / 'decision.json').read_text())
          assert 'development_material_regressions' in decision
          assert 'holdout_material_regressions' in decision
          for name in ('measurements.csv','summary.csv','confidence.csv','ANALYSIS.md','manifest.json','SHA256SUMS'):
              assert (p / name).is_file() and (p / name).stat().st_size > 0, name
          PY
      - name: Upload full PR50 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr50-predictive-economic-full
          path: results/pr50-economic
          if-no-files-found: error
          retention-days: 90

  persist-completed:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[pr50-persist]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 3fb5f57a19c477742c0a87bac6f901f53b37d732
      SOURCE_RUN: "37892264840"
      ARTIFACT_NAME: ades-pr50-predictive-economic-full
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr50-predictive-economic-residency
      - name: Download completed PR50 artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr50-artifact
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir /tmp/pr50-artifact
          for f in measurements.csv summary.csv confidence.csv ANALYSIS.md decision.json manifest.json; do
            test -s "/tmp/pr50-artifact/$f"
          done
      - name: Commit permanent compact evidence
        run: |
          set -euo pipefail
          dest="evidence/pr50-economic/${SOURCE_SHA}"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp /tmp/pr50-artifact/measurements.csv "$dest/"
          cp /tmp/pr50-artifact/summary.csv "$dest/"
          cp /tmp/pr50-artifact/confidence.csv "$dest/"
          cp /tmp/pr50-artifact/ANALYSIS.md "$dest/"
          cp /tmp/pr50-artifact/decision.json "$dest/"
          cp /tmp/pr50-artifact/manifest.json "$dest/"
          cat > "$dest/README.md" <<EOF
          # PR50 Predictive Economic Residency Evidence

          This directory permanently preserves the first frozen ADES-v2 development + holdout evaluation.

          - Source commit: \`${SOURCE_SHA}\`
          - GitHub Actions run: \`${SOURCE_RUN}\`
          - Full artifact: \`${ARTIFACT_NAME}\`
          - Development matrix: 36 PR49-derived regimes (tuning/regression evidence only)
          - Fresh holdout: 72 regimes using unseen graph classes, locality families, seeds, and update modes

          The holdout is preserved before any post-result controller tuning. Negative evidence is retained: the frozen ADES-v2 has one statistically material holdout regression under the predeclared >=10% rule.

          Browsable tables are committed directly. \`compact-evidence.tgz\` additionally contains all canonical workload traces and exact oracle bundles used by the development and holdout matrices.
          EOF
          tar -C /tmp/pr50-artifact -czf "$dest/compact-evidence.tgz" \
            measurements.csv summary.csv confidence.csv ANALYSIS.md decision.json manifest.json \
            development/traces development/oracles holdout/traces holdout/oracles
          (cd "$dest" && sha256sum README.md ANALYSIS.md decision.json manifest.json measurements.csv summary.csv confidence.csv compact-evidence.tgz > SHA256SUMS)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "evidence: preserve PR50 frozen evaluation [skip ci]"
          git push
