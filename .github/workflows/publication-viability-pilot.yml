name: ADES publication viability pilot

on:
  pull_request:
  push:
    branches:
      - pr49-publication-viability-pilot
  workflow_dispatch:
    inputs:
      queries:
        description: Queries per trace for full pilot
        required: false
        default: "60"
      persist:
        description: Persist compact evidence package to the selected branch
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  pilot:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Verify committed NY graph
        run: bash tools/verify_ny_dimacs.sh benchmarks/data
      - name: Validate pilot Python
        run: python3 -m py_compile tools/run_publication_pilot.py tools/generate_synthetic_graphs.py
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Run PR structural smoke
        if: github.event_name == 'pull_request'
        run: |
          python3 tools/run_publication_pilot.py \
            --repo . --build build --output results/pr49-pilot-smoke \
            --queries 12 --smoke
          test -s results/pr49-pilot-smoke/measurements.csv
          test -s results/pr49-pilot-smoke/summary.csv
          test -s results/pr49-pilot-smoke/confidence.csv
          test -s results/pr49-pilot-smoke/ANALYSIS.md
          test -s results/pr49-pilot-smoke/manifest.json
          test -s results/pr49-pilot-smoke/SHA256SUMS
      - name: Run full frozen pilot
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 tools/run_publication_pilot.py \
            --repo . --build build --output results/pr49-pilot \
            --queries '${{ inputs.queries }}'
          python3 - <<'PY'
          import json
          from pathlib import Path
          decision = json.loads(Path('results/pr49-pilot/decision.json').read_text())
          assert decision['decision'] in {'GO', 'REFRAME', 'NO-GO'}
          assert decision['regime_count'] == 36
          PY
      - name: Upload smoke evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr49-pilot-smoke
          path: results/pr49-pilot-smoke
          if-no-files-found: error
          retention-days: 30
      - name: Upload full pilot evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr49-publication-viability-pilot
          path: results/pr49-pilot
          if-no-files-found: error
          retention-days: 90
      - name: Persist compact pilot evidence
        if: github.event_name == 'workflow_dispatch' && inputs.persist == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          dest="evidence/pr49-pilot/${SOURCE_SHA}"
          mkdir -p "$dest"
          cp results/pr49-pilot/measurements.csv "$dest/"
          cp results/pr49-pilot/summary.csv "$dest/"
          cp results/pr49-pilot/confidence.csv "$dest/"
          cp results/pr49-pilot/ANALYSIS.md "$dest/"
          cp results/pr49-pilot/decision.json "$dest/"
          cp results/pr49-pilot/manifest.json "$dest/"
          cp -R results/pr49-pilot/traces "$dest/"
          cp -R results/pr49-pilot/oracles "$dest/"
          python3 - "$dest" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'SHA256SUMS')
          with (root / 'SHA256SUMS').open('w') as out:
              for p in files:
                  out.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "evidence: preserve PR49 viability pilot [skip ci]"
          git push

  persist-completed-pilot:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'persist completed PR49 evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 1c3813391a041cf2a4ef55076f20478a1eb7dcd2
      SOURCE_RUN: "37887233906"
      ARTIFACT_NAME: ades-pr49-publication-viability-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr49-publication-viability-pilot
      - name: Download completed full-pilot artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr49-artifact
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir /tmp/pr49-artifact
          test -s /tmp/pr49-artifact/measurements.csv
          test -s /tmp/pr49-artifact/confidence.csv
          test -s /tmp/pr49-artifact/decision.json
      - name: Commit permanent compact evidence
        run: |
          set -euo pipefail
          dest="evidence/pr49-pilot/${SOURCE_SHA}"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp /tmp/pr49-artifact/ANALYSIS.md "$dest/"
          cp /tmp/pr49-artifact/decision.json "$dest/"
          cp /tmp/pr49-artifact/manifest.json "$dest/"
          cat > "$dest/README.md" <<EOF
          # PR49 Publication Viability Pilot Evidence

          This directory permanently preserves the PR49 pilot produced by GitHub Actions run \`${SOURCE_RUN}\` from source commit \`${SOURCE_SHA}\`.

          The frozen pilot decision is **REFRAME**. This is a scientific pilot outcome, not a scoped-SOTA claim. The PR48 DIRECT external-comparator set was empty at execution time, so the frozen PR49 decision rule did not permit \`GO\`.

          Browsable files:

          - \`ANALYSIS.md\` — generated interpretation under the predeclared decision rule.
          - \`decision.json\` — machine-readable GO / REFRAME / NO-GO result.
          - \`manifest.json\` — frozen matrix, source commit, statistics, and provenance.
          - \`SHA256SUMS\` — hashes for this permanent repository package.

          \`compact-evidence.tgz\` contains the complete compact scientific package: \`measurements.csv\`, \`summary.csv\`, \`confidence.csv\`, the analysis/decision/manifest files, every canonical Workload Generator v2 trace and trace metadata file, and every exact trace-specific oracle bundle.

          The original Actions artifact also contains per-process stdout/stderr/RSS files and regenerated PR47 synthetic graphs. The graphs are deterministic and already pinned by the dataset registry; per-process numeric RSS/timing values are retained in \`measurements.csv\`.
          EOF
          tar -C /tmp/pr49-artifact -czf "$dest/compact-evidence.tgz" \
            measurements.csv summary.csv confidence.csv ANALYSIS.md decision.json manifest.json SHA256SUMS traces oracles
          (cd "$dest" && sha256sum ANALYSIS.md decision.json manifest.json README.md compact-evidence.tgz > SHA256SUMS)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "evidence: preserve PR49 viability pilot [skip ci]"
          git push
