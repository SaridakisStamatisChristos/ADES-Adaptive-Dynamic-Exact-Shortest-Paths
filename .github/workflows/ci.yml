name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Validate benchmark Python
        run: |
          python3 -m py_compile \
            benchmarks/summarize_results.py \
            tools/phase_schema.py \
            tools/memory_crossover.py \
            tools/equal_byte_crossover.py \
            tools/validate_scientific_ablations.py \
            tools/generate_synthetic_graphs.py \
            tools/validate_dataset_registry.py \
            tools/validate_comparator_registry.py \
            tools/run_publication_pilot.py \
            tools/run_predictive_economic.py \
            tools/run_fast_economic.py \
            research/history/runners/publication_viability_pilot_v1.py \
            research/history/runners/predictive_economic_v2.py \
            research/history/runners/fast_economic_v3.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
