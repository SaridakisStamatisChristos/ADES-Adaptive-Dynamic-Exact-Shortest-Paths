name: ADES PR64 VeloGraphX weighted SSSP qualification

on:
  push:
    branches: [pr64-velographx-qualification]
  pull_request:
    paths:
      - 'benchmarks/velographx_weighted_sssp_probe.cpp'
      - 'tools/run_pr64_velographx_qualification.py'
      - '.github/workflows/pr64-velographx-qualification.yml'

permissions:
  contents: read

jobs:
  semantic-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v4
        with:
          path: harness
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch exact VeloGraphX paper snapshot
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sauravsingla/VeloGraphX.git external/velographx
          git -C external/velographx fetch --depth=1 origin 2aa84ce81a180487239c661b65639e5100136075
          git -C external/velographx checkout --detach 2aa84ce81a180487239c661b65639e5100136075
          test "$(git -C external/velographx rev-parse HEAD)" = '2aa84ce81a180487239c661b65639e5100136075'
          test -z "$(git -C external/velographx status --porcelain)"
      - name: Build probe against unmodified upstream headers
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic \
            -I external/velographx/include \
            harness/benchmarks/velographx_weighted_sssp_probe.cpp \
            -o velographx_probe
          python3 -m py_compile harness/tools/run_pr64_velographx_qualification.py
      - name: Execute isolated semantic cases
        run: |
          mkdir -p harness/results/pr64-velographx
          python3 harness/tools/run_pr64_velographx_qualification.py \
            --probe ./velographx_probe \
            --out harness/results/pr64-velographx \
            --timeout 15 \
            | tee harness/results/pr64-velographx.stdout.txt
      - name: Verify exact PR59 NY graph and update-edge representability
        run: |
          set -euo pipefail
          echo '7b2446c7ffe6179efbc42af6812448e8cb782f12968ca2bb1d50d979343056d4  harness/benchmarks/data/USA-road-d.NY.gr.gz' | sha256sum --check --strict
          echo 'de902573142dbf12c42b065d9a6a679e4794372eb91d2748ee78089720377156  harness/benchmarks/data/USA-road-t.NY.gr.gz' | sha256sum --check --strict
          python3 - <<'PY'
          import gzip, json, pathlib
          files = [
              ('USA-road-d.NY.gr.gz','7b2446c7ffe6179efbc42af6812448e8cb782f12968ca2bb1d50d979343056d4'),
              ('USA-road-t.NY.gr.gz','de902573142dbf12c42b065d9a6a679e4794372eb91d2748ee78089720377156'),
          ]
          update_ids = [400578,555030,69321,725350,302832,21258,108846,117290,568843,543238,122412,30533,225119,214623,193688,182128,731540,222086,651180,326586,135690,236985,373241,632917,3166,472831,98783,185087,475373]
          result = {'schema':'ades-pr64-velographx-ny-representability-v3','pr59_trace_update_edge_ids':update_ids,'graphs':{}}
          all_updates_unambiguous = True
          all_duplicates_weight_equivalent = True
          for name, sha in files:
              path = pathlib.Path('harness/benchmarks/data')/name
              by_pair, edge_records = {}, []
              with gzip.open(path,'rt',encoding='ascii') as f:
                  for line in f:
                      if not line.startswith('a '): continue
                      _, us, vs, ws = line.split()
                      edge_id=len(edge_records); u,v,w=int(us),int(vs),int(ws)
                      edge_records.append((u,v,w)); by_pair.setdefault((u,v),[]).append(edge_id)
              duplicate_groups={pair:ids for pair,ids in by_pair.items() if len(ids)>1}
              conflicting=[]
              for (u,v), ids in duplicate_groups.items():
                  weights=sorted({edge_records[i][2] for i in ids})
                  if len(weights)>1: conflicting.append({'u':u,'v':v,'edge_ids':ids,'weights':weights})
              touched=[]
              for edge_id in update_ids:
                  u,v,w=edge_records[edge_id]; group=by_pair[(u,v)]
                  if len(group)>1: touched.append({'edge_id':edge_id,'u':u,'v':v,'weight':w,'same_endpoint_edge_ids':group})
              unambiguous=not touched; equivalent=not conflicting
              all_updates_unambiguous &= unambiguous; all_duplicates_weight_equivalent &= equivalent
              result['graphs'][name]={
                  'sha256':sha,'arc_count':len(edge_records),'unique_endpoint_pairs':len(by_pair),
                  'duplicate_endpoint_group_count':len(duplicate_groups),
                  'duplicate_endpoint_extra_arc_count':sum(len(ids)-1 for ids in duplicate_groups.values()),
                  'duplicate_endpoint_conflicting_weight_group_count':len(conflicting),
                  'first_conflicting_weight_examples':conflicting[:10],
                  'duplicate_collapse_preserves_initial_weights':equivalent,
                  'pr59_updated_edges_with_duplicate_endpoints':touched,
                  'pr59_update_edge_identity_unambiguous':unambiguous,
              }
          result['all_pr59_trace_updates_endpoint_unambiguous']=all_updates_unambiguous
          result['all_duplicate_groups_weight_equivalent']=all_duplicates_weight_equivalent
          result['pr59_ny_trace_semantically_representable_after_duplicate_collapse']=all_updates_unambiguous and all_duplicates_weight_equivalent
          pathlib.Path('harness/results/pr64-velographx/ny-representability.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - name: Record source identities
        env:
          HARNESS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "upstream_commit=$(git -C external/velographx rev-parse HEAD)"
            echo "harness_commit=$HARNESS_SHA"
            sha256sum external/velographx/LICENSE
            sha256sum external/velographx/include/velographx/incremental/weighted_sssp.hpp
            sha256sum external/velographx/include/velographx/storage/weighted_dynamic_graph.hpp
          } > harness/results/pr64-velographx/source-identities.txt
      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr64-velographx-${{ github.event.pull_request.head.sha || github.sha }}
          path: harness/results/pr64-velographx/
          if-no-files-found: error
          retention-days: 90
