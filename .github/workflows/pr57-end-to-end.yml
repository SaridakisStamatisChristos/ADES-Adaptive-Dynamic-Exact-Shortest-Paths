name: ADES PR57 broad end-to-end matrix

on:
  pull_request:
    paths:
      - 'include/ades/dynamic_repair.hpp'
      - 'src/dynamic_repair.cpp'
      - 'tools/run_pr57_end_to_end.py'
      - '.github/workflows/pr57-end-to-end.yml'
  push:
    branches:
      - pr57-alternate-witness-rescue

permissions:
  contents: read

jobs:
  broad-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout frozen PR55 baseline
        uses: actions/checkout@v4
        with:
          ref: pr55-radix-heap-ablation
          path: baseline
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build isolated runners
        run: |
          cmake -S baseline -B baseline/build -DCMAKE_BUILD_TYPE=Release
          cmake --build baseline/build -j2 --target ades_pilot_profile
          cmake -S candidate -B candidate/build -DCMAKE_BUILD_TYPE=Release
          cmake --build candidate/build -j2 --target ades_pilot_profile ades_workload_v2 ades_pr57_witness_rescue_tests
          candidate/build/ades_pr57_witness_rescue_tests
      - name: Generate common deterministic graphs
        run: |
          mkdir -p shared/graphs
          python3 candidate/tools/generate_synthetic_graphs.py shared/graphs --only syn-grid-224x224-v1
          python3 candidate/tools/generate_synthetic_graphs.py shared/graphs --only syn-scale-free-50000-m4-v1
          python3 candidate/tools/generate_synthetic_graphs.py shared/graphs --only syn-clustered-50000-c100-d6-v1
      - name: Run PR55 vs PR57 broad matrix
        run: |
          python3 candidate/tools/run_pr57_end_to_end.py \
            --baseline-runner baseline/build/ades_pilot_profile \
            --candidate-runner candidate/build/ades_pilot_profile \
            --generator candidate/build/ades_workload_v2 \
            --graph-dir shared/graphs \
            --out candidate/results/pr57-end-to-end
      - name: Upload development evidence
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr57-end-to-end-${{ github.sha }}
          path: candidate/results/pr57-end-to-end/
          if-no-files-found: error
          retention-days: 90
