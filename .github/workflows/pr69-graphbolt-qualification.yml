name: ADES PR69 GraphBolt weighted SSSP qualification

on:
  push:
    branches: [pr69-graphbolt-weighted-sssp-qualification]
  pull_request:
    paths:
      - 'tools/run_pr69_graphbolt_qualification.py'
      - '.github/workflows/pr69-graphbolt-qualification.yml'

permissions:
  contents: read

env:
  GRAPHBOLT_SHA: 7c2792cc77d59b9722288ded8c3c62f6a9a87fc7
  MIMALLOC_SHA: 04f1c3b1e23677ce03bd16137e73089abd552175

jobs:
  qualify-graphbolt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify harness syntax
        run: python3 -m py_compile tools/run_pr69_graphbolt_qualification.py

      - name: Fetch exact upstream GraphBolt DZiG revision
        run: |
          set -euo pipefail
          git clone https://github.com/pdclab/graphbolt.git external/graphbolt
          git -C external/graphbolt checkout --detach "$GRAPHBOLT_SHA"
          test "$(git -C external/graphbolt rev-parse HEAD)" = "$GRAPHBOLT_SHA"
          test -z "$(git -C external/graphbolt status --porcelain)"
          sha256sum \
            external/graphbolt/apps/SSSP.C \
            external/graphbolt/apps/SSSP_edgeData.h \
            external/graphbolt/core/graphBolt/KickStarterEngine.h \
            external/graphbolt/core/graphBolt/ingestor.h \
            external/graphbolt/core/common/parallel.h \
            > graphbolt-source-sha256.txt

      - name: Build upstream-required mimalloc v1.6.0
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/mimalloc.git external/mimalloc
          git -C external/mimalloc checkout --detach "$MIMALLOC_SHA"
          test "$(git -C external/mimalloc rev-parse HEAD)" = "$MIMALLOC_SHA"
          test -z "$(git -C external/mimalloc status --porcelain)"
          cmake -S external/mimalloc -B external/mimalloc/out/release \
            -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_TESTS=OFF
          cmake --build external/mimalloc/out/release --parallel 2
          test -f external/mimalloc/out/release/libmimalloc.so
          sha256sum external/mimalloc/out/release/libmimalloc.so > mimalloc-library-sha256.txt

      - name: Build unmodified weighted SSSP through upstream OpenMP path
        run: |
          set -euo pipefail
          mkdir -p graphbolt-runtime
          g++ -std=c++14 -O3 -g -DOPENMP -fopenmp -DEDGELONG -DEDGEDATA \
              -include cstdint external/graphbolt/apps/SSSP.C -pthread \
              -o graphbolt-runtime/graphbolt_sssp
          test -x graphbolt-runtime/graphbolt_sssp
          test -z "$(git -C external/graphbolt status --porcelain)"
          ldd graphbolt-runtime/graphbolt_sssp | tee graphbolt-ldd.txt
          g++ --version | head -1 | tee graphbolt-compiler.txt

      - name: Diagnostic - frozen semantic matrix with one OpenMP thread
        env:
          OMP_NUM_THREADS: '1'
          LD_PRELOAD: ${{ github.workspace }}/external/mimalloc/out/release/libmimalloc.so
        run: |
          set +e
          mkdir -p evidence/pr69/diagnostic-omp1
          python3 tools/run_pr69_graphbolt_qualification.py \
            --graphbolt "$PWD/graphbolt-runtime/graphbolt_sssp" \
            --out evidence/pr69/diagnostic-omp1
          code=$?
          echo "$code" > evidence/pr69/diagnostic-omp1/diagnostic-exit-code.txt
          exit 0

      - name: Execute exact semantic qualification
        env:
          OMP_NUM_THREADS: '4'
          LD_PRELOAD: ${{ github.workspace }}/external/mimalloc/out/release/libmimalloc.so
        run: |
          set +e
          mkdir -p evidence/pr69
          python3 tools/run_pr69_graphbolt_qualification.py \
            --graphbolt "$PWD/graphbolt-runtime/graphbolt_sssp" \
            --out evidence/pr69
          code=$?
          echo "$code" > evidence/pr69/qualification-exit-code.txt
          exit 0

      - name: Enforce preregistered qualification rule
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('evidence/pr69/qualification.json').read_text())
          assert d['graphbolt_commit'] == '7c2792cc77d59b9722288ded8c3c62f6a9a87fc7'
          assert d['full_matrix_executed'] is True
          assert d['all_exact'] is True
          assert d['exact_case_count'] == 9
          assert d['qualification'] == 'QUALIFIED_DIRECTED_FIXED_SOURCE_WEIGHTED_STREAMING_SSSP_WITH_UINT16_DISTANCE_BOUND'
          print('GRAPHBOLT QUALIFICATION PASS')
          print('checks=', d['checks'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/pr69/provenance
          cp graphbolt-source-sha256.txt evidence/pr69/provenance/ || true
          cp graphbolt-ldd.txt evidence/pr69/provenance/ || true
          cp graphbolt-compiler.txt evidence/pr69/provenance/ || true
          cp mimalloc-library-sha256.txt evidence/pr69/provenance/ || true
          {
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "head_sha=${GITHUB_SHA}"
            echo "graphbolt_sha=$(git -C external/graphbolt rev-parse HEAD)"
            echo "mimalloc_sha=$(git -C external/mimalloc rev-parse HEAD)"
            echo "semantic_build_parallel_mode=upstream OPENMP branch; qualification OMP_NUM_THREADS=4"
            echo "semantic_build_compatibility_include=-include cstdint"
            echo "semantic_build_allocator=mimalloc v1.6.0 at 04f1c3b1e23677ce03bd16137e73089abd552175"
            echo "preflight_7=mimalloc restored; pristine O3 OMP4 still timed out on frozen first case"
            echo "preflight_8=pristine O3 OMP1 timed out identically; multithread race hypothesis falsified"
            echo "preflight_11=pristine GCC13 O0 OMP1 changed failure to immediate SIGILL(returncode=-4)"
            echo "preflight_12=UBSan identified execution reaching end of KickStarterEngine::traditionalIncrementalComputation() without return; stack initialCompute->run->SSSP"
            python3 --version
            g++ --version | head -1
            cmake --version | head -1
            uname -a
          } > evidence/pr69/provenance/environment.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr69-graphbolt-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/pr69
          if-no-files-found: warn
          retention-days: 90

  portability-patch-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@v4

      - name: Fetch pinned GraphBolt and mimalloc
        run: |
          set -euo pipefail
          git clone https://github.com/pdclab/graphbolt.git external/graphbolt
          git -C external/graphbolt checkout --detach "$GRAPHBOLT_SHA"
          test "$(git -C external/graphbolt rev-parse HEAD)" = "$GRAPHBOLT_SHA"
          test -z "$(git -C external/graphbolt status --porcelain)"
          mkdir -p evidence/pr69-patch
          sha256sum external/graphbolt/core/graphBolt/KickStarterEngine.h > evidence/pr69-patch/upstream-kickstarter-sha256.txt
          git clone https://github.com/microsoft/mimalloc.git external/mimalloc
          git -C external/mimalloc checkout --detach "$MIMALLOC_SHA"
          test "$(git -C external/mimalloc rev-parse HEAD)" = "$MIMALLOC_SHA"
          cmake -S external/mimalloc -B external/mimalloc/out/release \
            -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_TESTS=OFF
          cmake --build external/mimalloc/out/release --parallel 2
          test -f external/mimalloc/out/release/libmimalloc.so

      - name: Apply exactly one missing-return portability repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('external/graphbolt/core/graphBolt/KickStarterEngine.h')
          s = p.read_text()
          old = '''  int traditionalIncrementalComputation() {\n    while (active_vertices_bitset.anyScheduledTasks()) {'''
          if s.count(old) != 1:
              raise SystemExit('expected unique KickStarter traditionalIncrementalComputation signature not found')
          marker = '''      }\n    }\n  }\n\n  void deltaCompute(edgeArray &edge_additions, edgeArray &edge_deletions) {'''
          replacement = '''      }\n    }\n    return 0;  // ADES PR69 portability repair: caller ignores return value.\n  }\n\n  void deltaCompute(edgeArray &edge_additions, edgeArray &edge_deletions) {'''
          start = s.index(old)
          tail = s[start:]
          if tail.count(marker) != 1:
              raise SystemExit('expected unique function terminator not found')
          tail = tail.replace(marker, replacement, 1)
          p.write_text(s[:start] + tail)
          PY
          git -C external/graphbolt diff --check
          git -C external/graphbolt diff -- core/graphBolt/KickStarterEngine.h | tee evidence/pr69-patch/portability.patch
          test "$(git -C external/graphbolt diff --numstat | awk '{print $1":"$2":"$3}')" = "1:0:core/graphBolt/KickStarterEngine.h"
          sha256sum external/graphbolt/core/graphBolt/KickStarterEngine.h > evidence/pr69-patch/patched-kickstarter-sha256.txt
          sha256sum evidence/pr69-patch/portability.patch > evidence/pr69-patch/patch-sha256.txt

      - name: Build portability-patched O3 binary
        run: |
          set -euo pipefail
          mkdir -p graphbolt-runtime
          g++ -std=c++14 -O3 -g -DOPENMP -fopenmp -DEDGELONG -DEDGEDATA \
            -include cstdint external/graphbolt/apps/SSSP.C -pthread \
            -o graphbolt-runtime/graphbolt_sssp_patched
          test -x graphbolt-runtime/graphbolt_sssp_patched
          sha256sum graphbolt-runtime/graphbolt_sssp_patched > evidence/pr69-patch/binary-sha256.txt

      - name: Run frozen matrix patched OMP1
        env:
          OMP_NUM_THREADS: '1'
          LD_PRELOAD: ${{ github.workspace }}/external/mimalloc/out/release/libmimalloc.so
        run: |
          set +e
          python3 tools/run_pr69_graphbolt_qualification.py \
            --graphbolt "$PWD/graphbolt-runtime/graphbolt_sssp_patched" \
            --out evidence/pr69-patch/omp1
          rc=$?
          echo "$rc" > evidence/pr69-patch/omp1-exit-code.txt
          exit 0

      - name: Run frozen matrix patched OMP4
        env:
          OMP_NUM_THREADS: '4'
          LD_PRELOAD: ${{ github.workspace }}/external/mimalloc/out/release/libmimalloc.so
        run: |
          set +e
          python3 tools/run_pr69_graphbolt_qualification.py \
            --graphbolt "$PWD/graphbolt-runtime/graphbolt_sssp_patched" \
            --out evidence/pr69-patch/omp4
          rc=$?
          echo "$rc" > evidence/pr69-patch/omp4-exit-code.txt
          exit 0

      - name: Evaluate portability-patch diagnostic
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          outcomes = {}
          for mode in ('omp1', 'omp4'):
              d = json.loads(Path(f'evidence/pr69-patch/{mode}/qualification.json').read_text())
              outcomes[mode] = {
                  'full_matrix_executed': d['full_matrix_executed'],
                  'all_exact': d['all_exact'],
                  'exact_case_count': d['exact_case_count'],
                  'checks': d['checks'],
                  'qualification': d['qualification'],
              }
          Path('evidence/pr69-patch/diagnostic-summary.json').write_text(json.dumps({
              'diagnostic_only': True,
              'upstream_source_modified': True,
              'modification': 'one explicit return 0 in KickStarterEngine::traditionalIncrementalComputation; its SSSP caller ignores the return value',
              'semantic_matrix_changed': False,
              'outcomes': outcomes,
          }, indent=2, sort_keys=True) + '\n')
          print(json.dumps(outcomes, indent=2, sort_keys=True))
          PY

      - name: Upload portability diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr69-graphbolt-portability-patch-${{ github.sha }}
          path: evidence/pr69-patch
          if-no-files-found: error
          retention-days: 90
