name: ADES PR69 GraphBolt weighted SSSP qualification

on:
  push:
    branches: [pr69-graphbolt-weighted-sssp-qualification]
  pull_request:
    paths:
      - 'tools/run_pr69_graphbolt_qualification.py'
      - '.github/workflows/pr69-graphbolt-qualification.yml'

permissions:
  contents: read

env:
  GRAPHBOLT_SHA: 7c2792cc77d59b9722288ded8c3c62f6a9a87fc7
  MIMALLOC_SHA: 04f1c3b1e23677ce03bd16137e73089abd552175

jobs:
  qualify-graphbolt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify harness syntax
        run: python3 -m py_compile tools/run_pr69_graphbolt_qualification.py

      - name: Fetch exact upstream GraphBolt DZiG revision
        run: |
          set -euo pipefail
          git clone https://github.com/pdclab/graphbolt.git external/graphbolt
          git -C external/graphbolt checkout --detach "$GRAPHBOLT_SHA"
          test "$(git -C external/graphbolt rev-parse HEAD)" = "$GRAPHBOLT_SHA"
          test -z "$(git -C external/graphbolt status --porcelain)"
          sha256sum \
            external/graphbolt/apps/SSSP.C \
            external/graphbolt/apps/SSSP_edgeData.h \
            external/graphbolt/core/graphBolt/KickStarterEngine.h \
            external/graphbolt/core/graphBolt/ingestor.h \
            external/graphbolt/core/common/parallel.h \
            > graphbolt-source-sha256.txt

      - name: Build upstream-required mimalloc v1.6.0
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/mimalloc.git external/mimalloc
          git -C external/mimalloc checkout --detach "$MIMALLOC_SHA"
          test "$(git -C external/mimalloc rev-parse HEAD)" = "$MIMALLOC_SHA"
          test -z "$(git -C external/mimalloc status --porcelain)"
          cmake -S external/mimalloc -B external/mimalloc/out/release \
            -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_TESTS=OFF
          cmake --build external/mimalloc/out/release --parallel 2
          test -f external/mimalloc/out/release/libmimalloc.so
          sha256sum external/mimalloc/out/release/libmimalloc.so > mimalloc-library-sha256.txt

      - name: Build unmodified weighted SSSP through upstream OpenMP path
        run: |
          set -euo pipefail
          mkdir -p graphbolt-runtime
          g++ -std=c++14 -O3 -g -DOPENMP -fopenmp -DEDGELONG -DEDGEDATA \
              -include cstdint external/graphbolt/apps/SSSP.C -pthread \
              -o graphbolt-runtime/graphbolt_sssp
          test -x graphbolt-runtime/graphbolt_sssp
          test -z "$(git -C external/graphbolt status --porcelain)"
          ldd graphbolt-runtime/graphbolt_sssp | tee graphbolt-ldd.txt
          g++ --version | head -1 | tee graphbolt-compiler.txt

      - name: Diagnostic - frozen semantic matrix with one OpenMP thread
        env:
          OMP_NUM_THREADS: '1'
          LD_PRELOAD: ${{ github.workspace }}/external/mimalloc/out/release/libmimalloc.so
        run: |
          set +e
          mkdir -p evidence/pr69/diagnostic-omp1
          python3 tools/run_pr69_graphbolt_qualification.py \
            --graphbolt "$PWD/graphbolt-runtime/graphbolt_sssp" \
            --out evidence/pr69/diagnostic-omp1
          code=$?
          echo "$code" > evidence/pr69/diagnostic-omp1/diagnostic-exit-code.txt
          exit 0

      - name: Diagnostic - capture live stuck stack on frozen first case
        run: |
          set +e
          mkdir -p evidence/pr69/diagnostic-gdb/out
          echo "gdb intentionally unavailable in qualification job; stack capture moved to isolated localize-gdb job" \
            > evidence/pr69/diagnostic-gdb/backtrace.txt
          exit 0

      - name: Execute exact semantic qualification
        env:
          OMP_NUM_THREADS: '4'
          LD_PRELOAD: ${{ github.workspace }}/external/mimalloc/out/release/libmimalloc.so
        run: |
          set +e
          mkdir -p evidence/pr69
          python3 tools/run_pr69_graphbolt_qualification.py \
            --graphbolt "$PWD/graphbolt-runtime/graphbolt_sssp" \
            --out evidence/pr69
          code=$?
          echo "$code" > evidence/pr69/qualification-exit-code.txt
          exit 0

      - name: Enforce preregistered qualification rule
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('evidence/pr69/qualification.json').read_text())
          assert d['graphbolt_commit'] == '7c2792cc77d59b9722288ded8c3c62f6a9a87fc7'
          assert d['full_matrix_executed'] is True
          assert d['all_exact'] is True
          assert d['exact_case_count'] == 9
          assert d['qualification'] == 'QUALIFIED_DIRECTED_FIXED_SOURCE_WEIGHTED_STREAMING_SSSP_WITH_UINT16_DISTANCE_BOUND'
          print('GRAPHBOLT QUALIFICATION PASS')
          print('checks=', d['checks'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/pr69/provenance
          cp graphbolt-source-sha256.txt evidence/pr69/provenance/ || true
          cp graphbolt-ldd.txt evidence/pr69/provenance/ || true
          cp graphbolt-compiler.txt evidence/pr69/provenance/ || true
          cp mimalloc-library-sha256.txt evidence/pr69/provenance/ || true
          {
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "head_sha=${GITHUB_SHA}"
            echo "graphbolt_sha=$(git -C external/graphbolt rev-parse HEAD)"
            echo "mimalloc_sha=$(git -C external/mimalloc rev-parse HEAD)"
            echo "semantic_build_parallel_mode=upstream OPENMP branch; qualification OMP_NUM_THREADS=4"
            echo "diagnostic_parallel_mode=same frozen semantic matrix and binary; OMP_NUM_THREADS=1; diagnostic only"
            echo "semantic_build_compatibility_include=-include cstdint; source-preserving fix for missing upstream standard-header dependency"
            echo "semantic_build_allocator=mimalloc v1.6.0 at 04f1c3b1e23677ce03bd16137e73089abd552175; required by GraphBolt upstream documentation"
            echo "preflight_1=official Cilk path could not compile because stock gcc:8 lacks legacy cilk headers; no GraphBolt execution"
            echo "preflight_2=serial build compiled; redundant host chmod failed before execution"
            echo "preflight_3=upstream serial fallback execution timed out before initial output on first 64-vertex case; no exactness outcome"
            echo "preflight_4=Docker OpenMP build did not see SSSP.C in bind-mounted workdir; no compilation/execution"
            echo "preflight_5=modern native OpenMP build reached compiler but upstream parallel.h omitted <cstdint>; no GraphBolt execution"
            echo "preflight_6=source-preserving modern OpenMP build executed but first case timed out at 20s while mimalloc was omitted; upstream README states mimalloc is required for correct/efficient operation"
            echo "preflight_7=mimalloc restored and LD_PRELOAD active; OMP_NUM_THREADS=4 still timed out on first frozen case at 20s before semantic output; no exactness outcome"
            echo "preflight_8=same mimalloc-backed binary and frozen case timed out identically with OMP_NUM_THREADS=1; multi-thread race hypothesis falsified"
            echo "preflight_9=initial stack-capture attempt could not run because hosted runner lacked gdb; no localization evidence"
            python3 --version
            g++ --version | head -1
            cmake --version | head -1
            uname -a
          } > evidence/pr69/provenance/environment.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr69-graphbolt-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/pr69
          if-no-files-found: warn
          retention-days: 90

  localize-gdb:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@v4

      - name: Install GDB for diagnostic job only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb
          gdb --version | head -1 | tee gdb-version.txt

      - name: Fetch pinned GraphBolt and mimalloc
        run: |
          set -euo pipefail
          git clone https://github.com/pdclab/graphbolt.git external/graphbolt
          git -C external/graphbolt checkout --detach "$GRAPHBOLT_SHA"
          test "$(git -C external/graphbolt rev-parse HEAD)" = "$GRAPHBOLT_SHA"
          test -z "$(git -C external/graphbolt status --porcelain)"
          git clone https://github.com/microsoft/mimalloc.git external/mimalloc
          git -C external/mimalloc checkout --detach "$MIMALLOC_SHA"
          test "$(git -C external/mimalloc rev-parse HEAD)" = "$MIMALLOC_SHA"
          cmake -S external/mimalloc -B external/mimalloc/out/release \
            -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_TESTS=OFF
          cmake --build external/mimalloc/out/release --parallel 2
          test -f external/mimalloc/out/release/libmimalloc.so

      - name: Build exact current compatibility binary
        run: |
          set -euo pipefail
          mkdir -p graphbolt-runtime evidence/pr69-gdb/case evidence/pr69-gdb/out
          g++ -std=c++14 -O3 -g -DOPENMP -fopenmp -DEDGELONG -DEDGEDATA \
            -include cstdint external/graphbolt/apps/SSSP.C -pthread \
            -o graphbolt-runtime/graphbolt_sssp
          test -x graphbolt-runtime/graphbolt_sssp
          test -z "$(git -C external/graphbolt status --porcelain)"
          sha256sum graphbolt-runtime/graphbolt_sssp > evidence/pr69-gdb/binary-sha256.txt

      - name: Generate exact frozen first case
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('tools/run_pr69_graphbolt_qualification.py')
          spec = importlib.util.spec_from_file_location('pr69q', p)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          case = Path('evidence/pr69-gdb/case')
          base = m.make_graph(1201)
          repl = m.make_replacements(1201, base)
          m.write_weighted_adjacency(case / 'initial.adj', base)
          m.write_stream(case / 'stream.txt', repl)
          assert len(base) == 320
          assert len(repl) == 40
          print('frozen_case_ready seed=1201 source=0 edges=320 replacements=40 batches=80')
          PY
          sha256sum evidence/pr69-gdb/case/initial.adj evidence/pr69-gdb/case/stream.txt > evidence/pr69-gdb/case-sha256.txt

      - name: Capture live stack after five seconds
        env:
          LD_PRELOAD: ${{ github.workspace }}/external/mimalloc/out/release/libmimalloc.so
          OMP_NUM_THREADS: '1'
        run: |
          set +e
          exe="$PWD/graphbolt-runtime/graphbolt_sssp"
          graph="$PWD/evidence/pr69-gdb/case/initial.adj"
          stream="$PWD/evidence/pr69-gdb/case/stream.txt"
          out="$PWD/evidence/pr69-gdb/out/out-"
          cat > evidence/pr69-gdb/commands.gdb <<GDB
          set pagination off
          set confirm off
          set target-async on
          set environment OMP_NUM_THREADS 1
          set environment LD_PRELOAD $LD_PRELOAD
          run -source 0 -numberOfUpdateBatches 80 -nEdges 1 -fixedBatchSize -simple -enforceEdgeValidity -streamPath $stream -outputFile $out $graph &
          shell sleep 5
          interrupt
          info threads
          thread apply all bt full
          kill
          quit
          GDB
          timeout 30s gdb -q -batch -x evidence/pr69-gdb/commands.gdb "$exe" > evidence/pr69-gdb/backtrace.txt 2>&1
          rc=$?
          echo "$rc" > evidence/pr69-gdb/gdb-exit-code.txt
          tail -n 260 evidence/pr69-gdb/backtrace.txt || true
          exit 0

      - name: Record diagnostic provenance
        if: always()
        run: |
          set -euo pipefail
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "graphbolt_sha=${GRAPHBOLT_SHA}"
            echo "mimalloc_sha=${MIMALLOC_SHA}"
            echo "build=-std=c++14 -O3 -g -DOPENMP -fopenmp -DEDGELONG -DEDGEDATA -include cstdint"
            echo "omp_threads=1"
            echo "diagnostic_only=true"
            echo "semantic_gate_modified=false"
            cat gdb-version.txt || true
            g++ --version | head -1
            uname -a
          } > evidence/pr69-gdb/provenance.txt

      - name: Upload localization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr69-graphbolt-gdb-${{ github.sha }}
          path: evidence/pr69-gdb
          if-no-files-found: error
          retention-days: 90
