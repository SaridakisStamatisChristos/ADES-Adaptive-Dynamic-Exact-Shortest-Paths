name: ADES PR69 GraphBolt weighted SSSP qualification

on:
  push:
    branches: [pr69-graphbolt-weighted-sssp-qualification]
  pull_request:
    paths:
      - 'tools/run_pr69_graphbolt_qualification.py'
      - '.github/workflows/pr69-graphbolt-qualification.yml'

permissions:
  contents: read

env:
  GRAPHBOLT_SHA: 7c2792cc77d59b9722288ded8c3c62f6a9a87fc7

jobs:
  qualify-graphbolt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify harness syntax
        run: python3 -m py_compile tools/run_pr69_graphbolt_qualification.py

      - name: Fetch exact upstream GraphBolt DZiG revision
        run: |
          set -euo pipefail
          git clone https://github.com/pdclab/graphbolt.git external/graphbolt
          git -C external/graphbolt checkout --detach "$GRAPHBOLT_SHA"
          test "$(git -C external/graphbolt rev-parse HEAD)" = "$GRAPHBOLT_SHA"
          test -z "$(git -C external/graphbolt status --porcelain)"
          sha256sum \
            external/graphbolt/apps/SSSP.C \
            external/graphbolt/apps/SSSP_edgeData.h \
            external/graphbolt/core/graphBolt/KickStarterEngine.h \
            external/graphbolt/core/graphBolt/ingestor.h \
            external/graphbolt/core/common/parallel.h \
            > graphbolt-source-sha256.txt

      - name: Build unmodified weighted SSSP through upstream serial fallback
        run: |
          set -euo pipefail
          mkdir -p graphbolt-runtime
          docker pull gcc:8
          docker run --rm \
            -v "$PWD/external/graphbolt:/src:ro" \
            -v "$PWD/graphbolt-runtime:/out" \
            -w /src/apps \
            gcc:8 bash -lc '
              set -euo pipefail
              # The first frozen PR69 preflight demonstrated that the stock
              # gcc:8 image accepts -fcilkplus but does not ship the legacy
              # <cilk/...> development headers.  Do not vendor or patch those
              # headers after preregistration.  GraphBolt upstream itself
              # provides an explicit serial branch in core/common/parallel.h
              # whenever CILK/CILKP/OPENMP is not defined.  Use that upstream
              # path for semantic qualification only; no source is changed.
              g++ -std=c++14 -O3 -g -DEDGELONG -DEDGEDATA \
                  SSSP.C -pthread -o /out/graphbolt_sssp
            '
          # The container-created binary is already executable.  Do not chmod
          # it on the host: Docker creates the mounted output as root and the
          # hosted runner cannot change its mode, which caused preflight #2.
          test -x graphbolt-runtime/graphbolt_sssp
          ldd graphbolt-runtime/graphbolt_sssp | tee graphbolt-ldd.txt
          # This build is SEMANTIC-ONLY.  It is not admissible for performance:
          # a performance comparison must reproduce a defensible upstream
          # Cilk Plus + allocator execution substrate instead of using this
          # serial fallback.

      - name: Execute exact semantic qualification
        run: |
          set -euo pipefail
          python3 tools/run_pr69_graphbolt_qualification.py \
            --graphbolt "$PWD/graphbolt-runtime/graphbolt_sssp" \
            --out evidence/pr69

      - name: Enforce preregistered qualification rule
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('evidence/pr69/qualification.json').read_text())
          assert d['graphbolt_commit'] == '7c2792cc77d59b9722288ded8c3c62f6a9a87fc7'
          assert d['all_exact'] is True
          assert d['exact_case_count'] == 9
          assert d['qualification'] == 'QUALIFIED_DIRECTED_FIXED_SOURCE_WEIGHTED_STREAMING_SSSP_WITH_UINT16_DISTANCE_BOUND'
          print('GRAPHBOLT QUALIFICATION PASS')
          print('checks=', d['checks'])
          PY

      - name: Record provenance
        run: |
          set -euo pipefail
          mkdir -p evidence/pr69/provenance
          cp graphbolt-source-sha256.txt evidence/pr69/provenance/
          cp graphbolt-ldd.txt evidence/pr69/provenance/
          {
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "head_sha=${GITHUB_SHA}"
            echo "graphbolt_sha=$(git -C external/graphbolt rev-parse HEAD)"
            echo "semantic_build_image=gcc:8"
            echo "semantic_build_parallel_mode=upstream serial fallback (CILK/CILKP/OPENMP undefined)"
            echo "semantic_build_allocator=system/default (mimalloc intentionally omitted; semantic-only gate)"
            echo "preflight_1=legacy Cilk headers absent from stock gcc:8 image; no benchmark execution occurred"
            echo "preflight_2=unmodified serial build succeeded; host chmod of root-owned Docker output failed before execution"
            python3 --version
            docker --version
            uname -a
          } > evidence/pr69/provenance/environment.txt

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: ades-pr69-graphbolt-qualification-${{ github.sha }}
          path: evidence/pr69
          if-no-files-found: error
          retention-days: 90
