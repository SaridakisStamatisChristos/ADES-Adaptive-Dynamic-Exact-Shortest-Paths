name: NY DIMACS validation
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
jobs:
  ny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify NY DIMACS corpus
        run: bash tools/fetch_ny_dimacs.sh
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Unit and differential tests
        run: ctest --test-dir build --output-on-failure
      - name: Distance smoke
        run: ./build/ades_cli benchmarks/data/ny/USA-road-d.NY.gr.gz 1 1000
      - name: Travel-time smoke
        run: ./build/ades_cli benchmarks/data/ny/USA-road-t.NY.gr.gz 1 1000
