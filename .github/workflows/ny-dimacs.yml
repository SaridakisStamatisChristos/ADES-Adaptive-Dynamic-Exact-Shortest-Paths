name: NY DIMACS validation
on:
  push:
    paths:
      - 'benchmarks/data/**'
      - 'benchmarks/ny_smoke.sh'
      - 'tools/verify_ny_dimacs.sh'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
jobs:
  ny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Verify committed NY corpus
        run: |
          if ! bash tools/verify_ny_dimacs.sh benchmarks/data; then
            echo "Committed corpus unavailable; attempting canonical fallback."
            bash tools/fetch_ny_dimacs.sh benchmarks/data
            bash tools/verify_ny_dimacs.sh benchmarks/data
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Unit and differential tests
        run: ctest --test-dir build --output-on-failure
      - name: Assert pinned NY smoke distances
        run: bash benchmarks/ny_smoke.sh ./build/ades_cli benchmarks/data
      - name: B0-B4 NY correctness gate
        run: |
          for graph in benchmarks/data/USA-road-d.NY.gr.gz benchmarks/data/USA-road-t.NY.gr.gz; do
            for baseline in B0 B1 B2 B3 B4; do
              ./build/ades_bench "$graph" "$baseline" 40 7 0
            done
          done
          for workload in local cross clustered moving; do
            for baseline in B1 B4; do
              ./build/ades_bench benchmarks/data/USA-road-d.NY.gr.gz "$baseline" 20 7 0 "$workload" benchmarks/data/USA-road-d.NY.co.gz
            done
          done
      - name: Controller targeted exactness gate
        run: |
          for regime in small catastrophic; do
            for policy in fixed vertex work; do
              ./build/ades_controller_workload benchmarks/data/USA-road-d.NY.gr.gz "$regime" 3 7 "$policy"
            done
          done
